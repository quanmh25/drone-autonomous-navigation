
# RGB image
- ros_topic_name: "/front_rgbd/image"
  gz_topic_name: "/front_rgbd/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# Depth image
- ros_topic_name: "/front_rgbd/depth_image"
  gz_topic_name: "/front_rgbd/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# Camera calibration
- ros_topic_name: "/front_rgbd/camera_info"
  gz_topic_name: "/front_rgbd/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# Point cloud (optional)
- ros_topic_name: "/front_rgbd/points"
  gz_topic_name: "/front_rgbd/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# Drone velocity commands
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Drone odometry
- ros_topic_name: "/odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# Simulation clock
- ros_topic_name: "/clock"
  gz_topic_name: "/world/e2es_indoor/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS


# TF odom -> base_link
- ros_topic_name: "/tf"
  gz_topic_name: "/odom_tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS


# Right camera RGB image for visualization.
- ros_topic_name: "/right_rgbd/image"
  gz_topic_name: "/right_rgbd/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# Side depth for continuous wall following (not an input to SLAM).
- ros_topic_name: "/right_rgbd/depth_image"
  gz_topic_name: "/right_rgbd/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
